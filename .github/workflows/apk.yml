name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Web dosyalarını Android projesine kopyala
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Google Play paketi (AAB) derle
        working-directory: android
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ]; then
            echo "::warning::PLAY_UPLOAD_KEYSTORE secret'i yok; Google Play paketi atlandı."
            exit 0
          fi
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: APK adını düzenle
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "AracDefterim-1.0.${{ github.run_number }}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "AracDefterim-GooglePlay-1.0.${{ github.run_number }}.aab"
          fi

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Araç Defterim 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Telefonuna yüklemek için aşağıdaki **AracDefterim-1.0.${{ github.run_number }}.apk** dosyasına dokun.
            Daha önce kurduysan, yeni sürüm üzerine yüklenir ve kayıtların korunur.
            `.aab` dosyası yalnızca Google Play Console'a yüklemek içindir, telefona kurulmaz.
          files: |
            AracDefterim-1.0.${{ github.run_number }}.apk
            AracDefterim-GooglePlay-1.0.${{ github.run_number }}.aab
