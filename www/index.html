<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Araç Defterim</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Tek sütun telefon uygulaması: üstte plaka kimliği, altta tarihe göre sıralı yükümlülükler, düzenleme alttan açılan panelde */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d9dee5;
  --fg:#16202c; --muted:#5d6a7a; --accent:#1d4fb8; --accent-fg:#ffffff;
  --plate:#ffffff; --plate-ink:#0f1720; --plate-edge:#1b2430; --plate-band:#1d4fb8;
  --ok:#1f8a4c; --ok-bg:#e4f4ea; --warn:#b26a00; --warn-bg:#fdf0d9; --bad:#c0362c; --bad-bg:#fbe5e2;
  --none:#7b8696; --none-bg:#eceff3;
  --shadow:0 1px 2px rgba(16,30,50,.06),0 4px 16px rgba(16,30,50,.06);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a; --surface:#18202a; --surface-2:#1e2733; --line:#2b3644;
  --fg:#e7ecf2; --muted:#93a0b1; --accent:#6f9cff; --accent-fg:#0b1220;
  --plate:#f2f4f7; --plate-ink:#0f1720; --plate-edge:#000; --plate-band:#1d4fb8;
  --ok:#5fd08e; --ok-bg:#163223; --warn:#f0b454; --warn-bg:#3a2a10; --bad:#ff7d72; --bad-bg:#3d1b18;
  --none:#8d99a9; --none-bg:#232c37; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.top .r{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.icon-btn{width:38px;height:36px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.plate{display:flex;align-items:stretch;align-self:flex-start;max-width:100%;border:2px solid var(--plate-edge);border-radius:7px;background:var(--plate);color:var(--plate-ink);overflow:hidden}
.plate .tr{background:var(--plate-band);color:#fff;font:700 12px/1 var(--f-body);display:flex;align-items:flex-end;justify-content:center;padding:0 7px 6px;width:30px}
.plate .no{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.08em;padding:2px 14px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.model{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.next{border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.85}
.next .what{font-weight:700;font-size:17px}
.next .big{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.next .big span{display:block;font-family:var(--f-body);font-size:12px;font-weight:600}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-none{background:var(--none-bg);color:var(--none)}

.banner{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}

.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;padding:13px 14px 13px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.bar{align-self:stretch;border-radius:0 4px 4px 0}
.bar.s-ok{background:var(--ok)} .bar.s-warn{background:var(--warn)} .bar.s-bad{background:var(--bad)} .bar.s-none{background:var(--line)}
.item .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .name{font-weight:600}
.item .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:6px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0}
.empty p{color:var(--muted);margin:0;max-width:34ch}
.note{font-size:12px;color:var(--muted);text-align:center}

.scrim{position:fixed;inset:0;background:rgba(8,14,22,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;background:var(--surface-2)}
.chip input{accent-color:var(--accent);margin:0}
.sheet .acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.sheet .acts .r{display:flex;gap:10px;margin-left:auto}
.group{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
const P = (window.Capacitor && window.Capacitor.Plugins) || {};
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const TYPES = {
  muayene:{name:"Araç muayenesi", months:24, hint:"Otomobilde 2 yılda bir, ticari araçta yılda bir."},
  trafik:{name:"Trafik sigortası", months:12},
  kasko:{name:"Kasko", months:12},
  mtv:{name:"MTV", months:0, hint:"Ocak ve Temmuz sonunda iki taksit."},
  egzoz:{name:"Egzoz emisyon ölçümü", months:24},
  bakim:{name:"Periyodik bakım", months:12},
};
const ORDER = ["muayene","trafik","kasko","mtv","egzoz","bakim"];
const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const DEFAULT_SETTINGS = {notify:true, offsets:[30,7,1,0], hour:10};

let state = {vehicles:[], settings:{...DEFAULT_SETTINGS}}, current = null, ui = {}, notifPerm = "unknown";

/* ---------- tarih ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const daysLeft = s => Math.round((parse(s) - today())/86400000);
const fmt = s => { const d = parse(s); return d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear(); };
function addMonths(s, m){ const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); }
function nextMtv(from){ const t = from || today(); const y = t.getFullYear();
  const jan = new Date(y,0,31), jul = new Date(y,6,31);
  if (t <= jan) return iso(jan); if (t <= jul) return iso(jul); return iso(new Date(y+1,0,31)); }
function mtvAfter(s){ const d = parse(s); d.setDate(d.getDate()+1); return nextMtv(d); }

function status(it){
  if (!it.date) return {cls:"s-none", text:"Tarih yok"};
  const n = daysLeft(it.date);
  if (n < 0) return {cls:"s-bad", text:(-n)+" gün geçti"};
  if (n === 0) return {cls:"s-bad", text:"Bugün"};
  if (n <= 30) return {cls:"s-warn", text:n+" gün kaldı"};
  return {cls:"s-ok", text:n+" gün"};
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function newVehicle(f){
  const items = {};
  ORDER.forEach(k => items[k] = {type:k, date: k==="mtv" ? nextMtv() : "", note:"", months: k==="muayene" && f.kind==="ticari" ? 12 : TYPES[k].months});
  return {id:uid(), plate:f.plate, model:f.model, kind:f.kind, items, created:Date.now()};
}
function itemList(v){
  return Object.entries(v.items||{}).map(([id,it]) => ({id, ...it, name: it.type==="custom" ? it.title : (TYPES[it.type]?.name || it.title)}))
    .sort((a,b) => (a.date?daysLeft(a.date):1e9) - (b.date?daysLeft(b.date):1e9));
}

/* ---------- saklama ---------- */
const KEY = "arac-defterim-v1";
async function load(){
  let raw = null;
  try { raw = P.Preferences ? (await P.Preferences.get({key:KEY})).value : localStorage.getItem(KEY); } catch {}
  if (raw){ try { const s = JSON.parse(raw); state = {vehicles:s.vehicles||[], settings:{...DEFAULT_SETTINGS, ...(s.settings||{})}}; } catch {} }
}
async function save(msg){
  const raw = JSON.stringify(state);
  try { if (P.Preferences) await P.Preferences.set({key:KEY, value:raw}); else localStorage.setItem(KEY, raw); }
  catch { toast("Kaydedilemedi. Telefonda boş alan olduğundan emin ol."); return; }
  render(); if (msg) toast(msg);
  scheduleAll();
}

/* ---------- bildirimler ---------- */
async function checkPerm(ask){
  const LN = P.LocalNotifications; if (!LN){ notifPerm = "none"; return notifPerm; }
  try {
    let r = await LN.checkPermissions();
    if (r.display !== "granted" && ask) r = await LN.requestPermissions();
    notifPerm = r.display;
  } catch { notifPerm = "none"; }
  return notifPerm;
}
async function scheduleAll(){
  const LN = P.LocalNotifications; if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id:n.id}))});
    if (!state.settings.notify || notifPerm !== "granted") return;
    const now = Date.now(), list = []; let id = 1;
    for (const v of state.vehicles){
      for (const it of itemList(v)){
        if (!it.date) continue;
        for (const off of state.settings.offsets){
          const at = parse(it.date); at.setDate(at.getDate()-off); at.setHours(state.settings.hour, 0, 0, 0);
          if (at.getTime() <= now) continue;
          list.push({ id: id++, title: `${v.plate} · ${it.name}`,
            body: off===0 ? `Bugün son gün (${fmt(it.date)}).` : `${off} gün kaldı, son tarih ${fmt(it.date)}.`,
            schedule:{at, allowWhileIdle:true}, smallIcon:"ic_stat_car", iconColor:"#1D4FB8" });
        }
      }
    }
    list.sort((a,b) => a.schedule.at - b.schedule.at);
    const batch = list.slice(0, 60);
    if (batch.length) await LN.schedule({notifications: batch});
  } catch(e){ console.warn("bildirim", e); }
}

/* ---------- yedek ---------- */
async function exportBackup(){
  const data = JSON.stringify({app:"arac-defterim", version:1, exported:new Date().toISOString(), ...state}, null, 2);
  const name = "arac-defterim-yedek-"+iso(today())+".json";
  try {
    if (P.Filesystem && P.Share){
      const w = await P.Filesystem.writeFile({path:name, data, directory:"CACHE", encoding:"utf8"});
      await P.Share.share({title:"Araç Defterim yedeği", files:[w.uri], dialogTitle:"Yedeği kaydet veya gönder"});
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name; a.click();
    }
  } catch(e){ if (!/cancel/i.test(String(e?.message||e))) toast("Yedek oluşturulamadı."); }
}
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (s.app !== "arac-defterim" || !Array.isArray(s.vehicles)) throw 0;
    state = {vehicles:s.vehicles, settings:{...DEFAULT_SETTINGS, ...(s.settings||{})}};
    current = null; closeSheet(); await save(`${s.vehicles.length} araç geri yüklendi`);
  } catch { toast("Bu dosya bir Araç Defterim yedeği değil."); }
});

/* ---------- arayüz ---------- */
const ICON_BELL = `<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
const cur = () => state.vehicles.find(x => x.id===current);

function render(){
  const app = document.getElementById("app");
  const vs = state.vehicles.sort((a,b) => (a.created||0)-(b.created||0));
  if (!vs.find(v => v.id===current)) current = vs[0]?.id || null;
  const v = cur();
  let h = `<div class="top"><div class="brand">Araç Defterim<small>Muayene · sigorta · MTV takibi</small></div>
    <div class="r"><button class="btn sm icon-btn" data-a="settings" aria-label="Ayarlar ve yedek">${ICON_BELL}</button>
    ${v ? `<button class="btn primary sm" data-a="addVehicle">+ Araç</button>` : ""}</div></div>`;
  if (NATIVE && state.settings.notify && notifPerm === "denied" && vs.length){
    h += `<div class="banner s-warn">Bildirim izni kapalı; hatırlatma gelmez.<button class="btn sm" data-a="askPerm">İzin ver</button></div>`;
  }
  if (vs.length > 1){
    h += `<div class="tabs" role="tablist">` + vs.map(x =>
      `<button class="tab" role="tab" aria-selected="${x.id===current}" data-a="pick" data-id="${x.id}">${esc(x.plate)}</button>`).join("") + `</div>`;
  }
  if (!v){
    h += `<div class="empty"><h2>İlk aracını ekle</h2>
      <p>Plakanı gir; muayene, trafik sigortası, kasko, MTV ve bakım tarihlerini tek yerde takip et. Tarih yaklaşınca telefonun haber verir.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" data-a="addVehicle">Araç ekle</button>
        <button class="btn" data-a="import">Yedekten yükle</button></div></div>`;
  } else {
    const items = itemList(v), nx = items.find(i => i.date), st = nx ? status(nx) : null;
    const dl = nx ? daysLeft(nx.date) : 0;
    h += `<section class="hero">
      <div class="plate" aria-label="Plaka"><div class="tr">TR</div><div class="no">${esc(v.plate)}</div></div>
      <div class="hero-row"><div><div class="model">${esc(v.model||"Model girilmedi")}</div>
        <div class="meta">${v.kind==="ticari"?"Ticari araç":"Otomobil"}</div></div>
        <button class="btn ghost sm" data-a="editVehicle">Aracı düzenle</button></div>
      ${nx ? `<div class="next ${st.cls}"><div><div class="lbl">Sıradaki</div><div class="what">${esc(nx.name)}</div><div style="font-size:13px">${fmt(nx.date)}</div></div>
        <div class="big">${Math.abs(dl)}<span>${dl<0?"gün geçti":"gün kaldı"}</span></div></div>`
        : `<div class="next s-none"><div><div class="lbl">Başlarken</div><div class="what">Aşağıdan tarihleri gir</div></div></div>`}
    </section>
    <div class="sec-h"><h2>Takvim</h2><button class="btn sm" data-a="addCustom">+ Hatırlatma</button></div>
    <div class="list">` + items.map(it => { const s = status(it);
      return `<div class="item"><div class="bar ${s.cls}"></div>
        <div class="body"><div class="name">${esc(it.name)}</div>
          <div class="sub">${it.date ? fmt(it.date) : "Son tarihi ekle"}${it.note ? " · "+esc(it.note) : ""}</div></div>
        <div class="side"><span class="pill ${s.cls}">${s.text}</span>
          <div class="acts">${it.date && (it.type==="mtv" || it.months) ? `<button class="btn sm" data-a="renew" data-id="${it.id}">${it.type==="mtv"?"Ödendi":"Yenilendi"}</button>`:""}
          <button class="btn sm ghost" data-a="editItem" data-id="${it.id}">${it.date?"Düzenle":"Tarih ekle"}</button></div></div></div>`;
    }).join("") + `</div>`;
  }
  h += `<div class="note">Kayıtlar bu telefonda saklanır. Telefon değiştirmeden önce yedek al.</div>`;
  app.innerHTML = h;
}

function sheet(html){
  document.getElementById("layer").innerHTML = `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
}
const closeSheet = () => { document.getElementById("layer").innerHTML = ""; ui = {}; };
function toast(t){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

function vehicleSheet(v){
  ui = {kind:"vehicle", id:v?.id};
  sheet(`<h3>${v?"Aracı düzenle":"Yeni araç"}</h3>
    <form id="vf" class="sheet-in" style="gap:14px">
    <div class="field"><label for="vp">Plaka</label><input id="vp" required maxlength="12" autocapitalize="characters" placeholder="50 AB 123" value="${esc(v?.plate)}"></div>
    <div class="field"><label for="vm">Marka / model</label><input id="vm" maxlength="40" placeholder="Fiat Egea 1.4" value="${esc(v?.model)}"></div>
    <div class="field"><label for="vk">Araç türü</label><select id="vk">
      <option value="otomobil"${v?.kind!=="ticari"?" selected":""}>Otomobil (muayene 2 yılda bir)</option>
      <option value="ticari"${v?.kind==="ticari"?" selected":""}>Ticari araç (muayene her yıl)</option></select></div>
    <div id="vconf"></div>
    <div class="acts">${v?`<button type="button" class="btn danger" data-a="askDelete">Aracı sil</button>`:""}
      <div class="r"><button type="button" class="btn ghost" data-a="close">Vazgeç</button><button class="btn primary">Kaydet</button></div></div></form>`);
}
function itemSheet(it){
  ui = {kind:"item", id:it?.id};
  const isCustom = !it || it.type==="custom", isMtv = it?.type==="mtv", t = it && TYPES[it.type];
  sheet(`<h3>${it ? esc(it.name) : "Yeni hatırlatma"}</h3>
    <form id="if" class="sheet-in" style="gap:14px">
    ${isCustom ? `<div class="field"><label for="it">Başlık</label><input id="it" required maxlength="40" placeholder="Kış lastiği, takograf, ruhsat…" value="${esc(it?.title)}"></div>`:""}
    <div class="field"><label for="id">${isMtv?"Taksit son günü":"Son geçerlilik tarihi"}</label><input id="id" type="date" value="${esc(it?.date)}" ${isCustom?"required":""}>
      ${t?.hint?`<span class="hint">${t.hint}</span>`:""}</div>
    ${isMtv ? "" : `<div class="field"><label for="im">Yenileme aralığı</label><select id="im">
      ${[[0,"Tekrarlamıyor"],[6,"6 ay"],[12,"1 yıl"],[24,"2 yıl"],[36,"3 yıl"]].map(([m,l]) =>
        `<option value="${m}"${Number(it?.months ?? 12)===m?" selected":""}>${l}</option>`).join("")}</select>
      <span class="hint">“Yenilendi” dediğinde tarih bu kadar ileri alınır.</span></div>`}
    <div class="field"><label for="in">Not</label><input id="in" maxlength="60" placeholder="Poliçe no, acente, km…" value="${esc(it?.note)}"></div>
    <div id="iconf"></div>
    <div class="acts">${it && isCustom?`<button type="button" class="btn danger" data-a="askDeleteItem">Sil</button>`:""}
      <div class="r"><button type="button" class="btn ghost" data-a="close">Vazgeç</button><button class="btn primary">Kaydet</button></div></div></form>`);
}
function settingsSheet(){
  ui = {kind:"settings"};
  const s = state.settings;
  sheet(`<h3>Hatırlatmalar</h3>
    <form id="sf" class="sheet-in" style="gap:14px">
    <label class="chip" style="align-self:flex-start"><input type="checkbox" id="sn" ${s.notify?"checked":""}> Bildirim gönder</label>
    <div class="field"><span class="lab">Ne zaman haber versin</span><div class="chips">
      ${[[30,"30 gün önce"],[15,"15 gün önce"],[7,"7 gün önce"],[3,"3 gün önce"],[1,"1 gün önce"],[0,"Son gün"]].map(([d,l]) =>
        `<label class="chip"><input type="checkbox" name="off" value="${d}" ${s.offsets.includes(d)?"checked":""}> ${l}</label>`).join("")}</div></div>
    <div class="field"><label for="sh">Bildirim saati</label><select id="sh">
      ${[8,9,10,12,14,18,20].map(h => `<option value="${h}"${s.hour===h?" selected":""}>${pad(h)}:00</option>`).join("")}</select></div>
    <div class="acts"><div class="r"><button type="button" class="btn ghost" data-a="close">Kapat</button><button class="btn primary">Kaydet</button></div></div>
    </form>
    <div class="group"><span class="lab">Yedek</span>
      <p>Yedek dosyasını WhatsApp, e-posta veya Drive'a kaydedebilirsin. Yeni telefonda “Yedekten yükle” ile geri alırsın.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="export">Yedek al</button><button class="btn" data-a="import">Yedekten yükle</button></div></div>`);
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, v = cur();
  if (a==="pick"){ current = b.dataset.id; render(); }
  else if (a==="close") closeSheet();
  else if (a==="settings") settingsSheet();
  else if (a==="export") exportBackup();
  else if (a==="import") document.getElementById("importFile").click();
  else if (a==="askPerm"){ await checkPerm(true); render(); scheduleAll(); if (notifPerm==="denied") toast("Telefon Ayarları › Uygulamalar › Araç Defterim › Bildirimler'den açabilirsin."); }
  else if (a==="addVehicle") vehicleSheet(null);
  else if (a==="editVehicle") vehicleSheet(v);
  else if (a==="addCustom") itemSheet(null);
  else if (a==="editItem") itemSheet(itemList(v).find(i => i.id===b.dataset.id));
  else if (a==="renew"){
    const it = v.items[b.dataset.id];
    it.date = it.type==="mtv" ? mtvAfter(it.date) : addMonths(it.date, it.months);
    save(`Yeni tarih: ${fmt(it.date)}`);
  }
  else if (a==="askDelete") document.getElementById("vconf").innerHTML = `<div class="confirm">${esc(v.plate)} ve tüm tarihleri silinsin mi?<button type="button" class="btn danger sm" data-a="doDelete">Evet, sil</button></div>`;
  else if (a==="doDelete"){ state.vehicles = state.vehicles.filter(x => x.id!==ui.id); closeSheet(); save("Araç silindi"); }
  else if (a==="askDeleteItem") document.getElementById("iconf").innerHTML = `<div class="confirm">Bu hatırlatma silinsin mi?<button type="button" class="btn danger sm" data-a="doDeleteItem">Evet, sil</button></div>`;
  else if (a==="doDeleteItem"){ delete v.items[ui.id]; closeSheet(); save("Hatırlatma silindi"); }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id==="vf"){
    const plate = document.getElementById("vp").value.trim().toLocaleUpperCase("tr-TR").replace(/\s+/g," ");
    const model = document.getElementById("vm").value.trim(), kind = document.getElementById("vk").value;
    if (!plate) return;
    if (ui.id){ const v = cur(); const was = v.kind; Object.assign(v,{plate,model,kind});
      if (was!==kind && v.items.muayene) v.items.muayene.months = kind==="ticari"?12:24; }
    else { const v = newVehicle({plate,model,kind}); state.vehicles.push(v); current = v.id;
      if (NATIVE && state.settings.notify && notifPerm !== "granted") await checkPerm(true); }
    closeSheet(); save("Kaydedildi");
  }
  if (id==="if"){
    const v = cur(); const iid = ui.id || "c_"+uid();
    const it = v.items[iid] || {type:"custom"};
    if (it.type==="custom") it.title = document.getElementById("it").value.trim();
    it.date = document.getElementById("id").value;
    const m = document.getElementById("im"); if (m) it.months = Number(m.value);
    it.note = document.getElementById("in").value.trim();
    v.items[iid] = it; closeSheet(); save("Kaydedildi");
  }
  if (id==="sf"){
    const offs = [...document.querySelectorAll('input[name="off"]:checked')].map(x => Number(x.value));
    state.settings = {notify: document.getElementById("sn").checked, offsets: offs.length ? offs : [7], hour: Number(document.getElementById("sh").value)};
    if (state.settings.notify && NATIVE) await checkPerm(true);
    closeSheet(); save(state.settings.notify ? "Hatırlatmalar güncellendi" : "Bildirimler kapatıldı");
  }
});

/* Android geri tuşu: önce paneli kapat */
if (P.App) P.App.addListener("backButton", () => { if (document.querySelector(".sheet")) closeSheet(); else P.App.exitApp(); });
/* Uygulama öne gelince günleri güncelle */
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

(async () => { await load(); await checkPerm(false); render(); scheduleAll(); })();
</script>
</body>
</html>
